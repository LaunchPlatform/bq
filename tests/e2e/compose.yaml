name: bqe2e

x-image: &image
  build:
    context: ../..
    dockerfile: tests/e2e/Dockerfile
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &app-env
    BQ_DATABASE_URL: postgresql+psycopg://bq@host.docker.internal:55432/bq
    BQ_PROCESSOR_PACKAGES: '["tests.e2e.processors"]'
    BQ_MAX_CONCURRENT_TASKS: "8"
    BQ_BATCH_SIZE: "8"
    BQ_POLL_TIMEOUT: "2"
    BQ_WORKER_HEARTBEAT_PERIOD: "2"
    BQ_WORKER_HEARTBEAT_TIMEOUT: "6"
    BQ_METRICS_HTTP_SERVER_ENABLED: "true"
    BQ_METRICS_HTTP_SERVER_PORT: "8000"
    PYTHONPATH: /app
    PYTHONUNBUFFERED: "1"

x-worker: &worker
  <<: *image
  command: ["bq", "--disable-rich-log", "process", "e2e"]
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  init: true
  restart: "no"
  stop_grace_period: 20s
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
    interval: 2s
    timeout: 2s
    retries: 20
    start_period: 15s

services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: bq
      POSTGRES_DB: bq
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bq -d bq"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: "no"

  migrate:
    <<: *image
    command: ["bq", "--disable-rich-log", "create_tables"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker-a:
    <<: *worker
    hostname: worker-a
    container_name: bqe2e-worker-a
    ports:
      - "18001:8000"

  worker-b:
    <<: *worker
    hostname: worker-b
    container_name: bqe2e-worker-b
    ports:
      - "18002:8000"

  worker-c:
    <<: *worker
    hostname: worker-c
    container_name: bqe2e-worker-c
    ports:
      - "18003:8000"

  tester:
    <<: *image
    command: ["python", "-m", "tests.e2e.harness"]
    environment:
      <<: *app-env
      E2E_DATABASE_URL: postgresql+psycopg://bq@host.docker.internal:55432/bq
      E2E_WORKER_HEALTH_URLS: http://host.docker.internal:18001/healthz,http://host.docker.internal:18002/healthz,http://host.docker.internal:18003/healthz
      E2E_WORKER_CONTAINERS: worker-a:bqe2e-worker-a,worker-b:bqe2e-worker-b,worker-c:bqe2e-worker-c
      E2E_BURST: "400"
      E2E_STRESS_SECONDS: "12"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      worker-a:
        condition: service_healthy
      worker-b:
        condition: service_healthy
      worker-c:
        condition: service_healthy
    restart: "no"
