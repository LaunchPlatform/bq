# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

orbs:
  python: circleci/python@2.1.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11.12
      - image: cimg/postgres:16.2
        environment:
          POSTGRES_USER: bq
          POSTGRES_DB: bq_test
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Run test
          command: uv run python -m pytest ./tests -svvvv
  e2e:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Install uv
          command: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run:
          name: Run Docker Compose end-to-end tests
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run python -m pytest tests/e2e -svvvv
          no_output_timeout: 15m
  build-and-publish:
    docker:
      - image: cimg/python:3.11.12
    steps:
      - checkout
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Build
          command: uv build
      - run:
          name: Publish
          command: uv publish

workflows:
  test:
    jobs:
      - test:
          filters:
            # needed for deploy build
            # ref: https://discuss.circleci.com/t/builds-for-tags-not-triggering/17681/7
            tags:
              only: /^.*/
      - e2e:
          filters:
            tags:
              only: /^.*/
      - build-and-publish:
          requires:
            - test
            - e2e
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^.*/
