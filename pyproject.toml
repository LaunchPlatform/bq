[project]
name = "beanqueue"
version = "2.0.0rc1"
description = "BeanQueue or BQ for short, PostgreSQL SKIP LOCK and SQLAlchemy based worker queue library"
authors = [{ name = "Fang-Pen Lin", email = "fangpen@launchplatform.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "psycopg[binary]>=3.1,<4",
    "venusian>=3.1.0,<4",
    "click>=8.1.7,<9",
    "pydantic-settings>=2.2.1,<3",
    "blinker>=1.8.2,<2",
    "rich>=13.7.1,<14",
]

[project.scripts]
bq = "bq.cmds.main:cli"

[project.optional-dependencies]
metrics = [
    "starlette>=0.27,<2",
    "uvicorn>=0.30.0,<1",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24,<2",
    "pytest-factoryboy>=2.7.0,<3",
    "starlette>=0.27,<2",
    "uvicorn>=0.30.0,<1",
    "httpx>=0.27.0,<1",
]

[tool.hatch.build.targets.sdist]
include = ["bq"]

[tool.hatch.build.targets.wheel]
include = ["bq"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/acceptance"]
norecursedirs = [".*", "build", "dist", "e2e"]
markers = [
    "e2e: docker compose end-to-end tests against real workers",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
